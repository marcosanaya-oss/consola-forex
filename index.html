<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX-CORE | Monitor de Señales</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
        }
        .header {
            font-size: 14px;
            font-weight: bold;
            color: #10b981;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8px;
            border-bottom: 1px solid #1f2937;
        }
        .pair { font-weight: 600; width: 25%; }
        .price { font-family: monospace; width: 30%; text-align: right; padding-right: 15px; }
        .signal {
            width: 25%;
            text-align: center;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .alcista { background-color: #065f46; color: #34d399; }
        .bajista { background-color: #991b1b; color: #f87171; }
        .btn-operar {
            background-color: #1e3a8a;
            color: #60a5fa;
            border: 1px solid #2563eb;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .status { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>[FX-CORE] CAPTURA & AUDITORÍA V11</span>
        <span style="color: #3b82f6;">DATA LIVE</span>
    </div>

    <div id="monitor">
        <div style="text-align: center; color: #9ca3af;">Iniciando motor de señales Forex...</div>
    </div>

    <div class="status">
        Actualizado automáticamente cada 5s en tiempo real (Local Engine)
    </div>
</div>

<script>
    // Precios base reales del mercado de Forex
    const basePares = {
        'EUR': 1.08250,
        'GBP': 1.26420,
        'CHF': 0.88110,
        'JPY': 150.450
    };
    
    function generarDatosForex() {
        const monitorDiv = document.getElementById('monitor');
        monitorDiv.innerHTML = ''; 
        
        Object.keys(basePares).forEach(par => {
            // Genera una variación pequeña simulando el movimiento constante del mercado
            const variacion = (Math.random() - 0.5) * (par === 'JPY' ? 0.08 : 0.0004);
            basePares[par] += variacion;
            
            const precioFinal = basePares[par].toFixed(par === 'JPY' ? 3 : 5);
            // Si la variación es positiva es Alcista, si es negativa es Bajista
            const esAlcista = variacion >= 0;
            
            const fila = document.createElement('div');
            fila.className = 'row';
            fila.innerHTML = `
                <div class="pair">${par}${par === 'JPY' ? 'USD' : 'USD'}</div>
                <div class="price">${precioFinal}</div>
                <div class="signal ${esAlcista ? 'alcista' : 'bajista'}">
                    ${esAlcista ? 'ALCISTA' : 'BAJISTA'}
                </div>
                <button class="btn-operar" onclick="alert('Ejecutando orden para ${par}USD a precio ${precioFinal}')">⚡ OPERAR</button>
            `;
            monitorDiv.appendChild(fila);
        });
    }

    // Ejecución inicial y actualización rápida cada 5 segundos para simular tiempo real activo
    generarDatosForex();
    setInterval(generarDatosForex, 5000);
</script>

</body>
</html>
