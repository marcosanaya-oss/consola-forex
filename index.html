<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX-CORE | Terminal Autónoma v15.6</title>
    <style>
        /* --- ESTILOS GENERALES Y PANEL OSCURO --- */
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: #131a26;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        /* --- SELECTOR DE DIVISAS --- */
        .selector-box {
            display: flex;
            gap: 10px;
        }

        .pair-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .pair-btn:hover {
            border-color: #38bdf8;
            color: #ffffff;
        }

        .pair-btn.active {
            background: #38bdf8;
            color: #0b0f19;
            border-color: #38bdf8;
        }

        /* --- PANELES DE DATOS EN TIEMPO REAL --- */
        .market-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .data-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
        }

        .data-card label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .data-card value {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: monospace;
        }

        /* --- PANELES DE ALERTAS DINÁMICAS (MSS) --- */
        #alert-panel {
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .alert-neutral {
            background-color: #1e222d;
            border-left: 6px solid #707a8a;
            color: #94a3b8;
        }

        .alert-bullish {
            background-color: rgba(14, 203, 129, 0.1);
            border-left: 6px solid #0ecb81;
            border-color: rgba(14, 203, 129, 0.2);
            color: #0ecb81;
            animation: pulse 2s infinite;
        }

        .alert-bearish {
            background-color: rgba(246, 70, 93, 0.1);
            border-left: 6px solid #f6465d;
            border-color: rgba(246, 70, 93, 0.2);
            color: #f6465d;
            animation: pulse 2s infinite;
        }

        .alert-title {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .alert-details {
            font-size: 1rem;
            font-weight: normal;
            color: #ffffff;
            margin-top: 10px;
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; }
            100% { opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FX-CORE TERMINAL</h1>
            <!-- Selectores dinámicos de divisas -->
            <div class="selector-box">
                <button id="btn-EURUSD" class="pair-btn active" onclick="cambiarPar('EURUSD')">EUR/USD</button>
                <button id="btn-GBPUSD" class="pair-btn" onclick="cambiarPar('GBPUSD')">GBP/USD</button>
                <button id="btn-USDCHF" class="pair-btn" onclick="cambiarPar('USDCHF')">USD/CHF</button>
            </div>
        </header>

        <!-- Datos de Mercado -->
        <div class="market-data">
            <div class="data-card">
                <label>Precio Actual</label>
                <value id="current-price">Conectando...</value>
            </div>
            <div class="data-card">
                <label>Filtro EMA Institucional</label>
                <value id="ema-value" style="color: #38bdf8;">Calculando...</value>
            </div>
        </div>

        <!-- Consola de Alertas Estructura Shift -->
        <div id="alert-panel" class="alert-neutral">
            <div class="alert-title">
                <span id="signal-type">CONECTANDO A RED DE TRADING PÚBLICA...</span>
            </div>
            <div class="alert-details" id="signal-details">
                Sincronizando flujo descentralizado en tiempo real.
            </div>
        </div>
    </div>

    <script>
        // Configuración de almacenamiento interno con streams públicos válidos de Binance
        const parConfig = {
            "EURUSD": { basePrice: 1.15940, stream: "eurusdt", pricesLog: [], lastHigh: 0, lastLow: Infinity, currentEma: 0 },
            "GBPUSD": { basePrice: 1.35320, stream: "gbpusdt", pricesLog: [], lastHigh: 0, lastLow: Infinity, currentEma: 0 },
            "USDCHF": { basePrice: 0.81150, stream: "chfusdt",  pricesLog: [], lastHigh: 0, lastLow: Infinity, currentEma: 0 }
        };

        let parActivo = "EURUSD";
        const maxLogLength = 20;
        const emaPeriod = 9;

        // Construcción limpia de streams combinados válidos
        const streamPath = Object.values(parConfig).map(p => `${p.stream}@ticker`).join('/');
        const ws = new WebSocket(`wss://://binance.com{streamPath}`);

        ws.onopen = () => {
            console.log("Terminal FX-CORE conectada con éxito.");
            document.getElementById('signal-type').innerText = "MONITOREANDO ACCIÓN DEL PRECIO";
            document.getElementById('signal-details').innerText = "Monitoreando rupturas y bloques institucionales activos.";
            document.getElementById('current-price').innerText = "Esperando ticks...";
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            if (!response.stream) return;

            // Extraer el nombre plano del stream para la comparación
            const incomingStream = response.stream.split('@')[0];
            
            Object.keys(parConfig).forEach(symbol => {
                if (parConfig[symbol].stream === incomingStream) {
                    const changePercent = parseFloat(response.data.P) / 100; 
                    
                    // Modificador inverso para USD/CHF ya que usamos el stream CHF/USDT
                    const finalPrice = (symbol === "USDCHF") 
                        ? parConfig[symbol].basePrice * (1 - changePercent)
                        : parConfig[symbol].basePrice * (1 + changePercent);
                    
                    procesarMotorTrading(symbol, finalPrice);
                }
            });
        };

        // --- MOTOR DE TRADING INSTITUCIONAL CENTRALIZADO ---
        function procesarMotorTrading(symbol, price) {
            const data = parConfig[symbol];
            data.pricesLog.push(price);
            if (data.pricesLog.length > maxLogLength) data.pricesLog.shift();

            // Calcular Media Móvil Exponencial (EMA)
            if (data.pricesLog.length >= emaPeriod) {
                if (data.currentEma === 0) {
                    data.currentEma = data.pricesLog.slice(0, emaPeriod).reduce((a, b) => a + b) / emaPeriod;
                } else {
                    const k = 2 / (emaPeriod + 1);
                    data.currentEma = price * k + data.currentEma * (1 - k);
                }
            }

            // Lógica de Rastreo de Estructuras (Máximos y Mínimos Locales)
            if (data.pricesLog.length > 5) {
                const localHigh = Math.max(...data.pricesLog.slice(-5));
                const localLow = Math.min(...data.pricesLog.slice(-5));

                if (localHigh > data.lastHigh || data.lastHigh === 0) data.lastHigh = localHigh;
                if (localLow < data.lastLow || data.lastLow === Infinity) data.lastLow = localLow;

                // Detección de Rupturas Estructurales (MSS)
                if (price > data.lastHigh && price > data.currentEma && data.currentEma > 0) {
                    data.lastHigh = price; 
                    if (symbol === parActivo) actualizarPantallaAlertas('ALCISTA', price, localLow);
                } 
                else if (price < data.lastLow && price < data.currentEma && data.currentEma > 0) {
                    data.lastLow = price; 
                    if (symbol === parActivo) actualizarPantallaAlertas('BAJISTA', price, localHigh);
                }
            }

            // Actualización de UI inmediata si corresponde a la pestaña seleccionada
            if (symbol === parActivo) {
                document.getElementById('current-price').innerText = price.toFixed(5);
