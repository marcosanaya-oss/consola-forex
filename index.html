<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX-CORE | Monitor de Señales v11</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
        }
        .header {
            font-size: 14px;
            font-weight: bold;
            color: #10b981;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-badge {
            background-color: #1e3a8a;
            color: #60a5fa;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8px;
            border-bottom: 1px solid #1f2937;
        }
        .pair-info { width: 25%; }
        .pair-name { font-weight: 600; font-size: 15px; }
        .session-info { font-size: 11px; color: #9ca3af; }
        .price { font-family: monospace; width: 25%; text-align: right; font-size: 14px; padding-right: 20px; }
        .signal {
            width: 25%;
            text-align: center;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .alcista { background-color: #065f46; color: #34d399; border: 1px solid #059669; }
        .bajista { background-color: #ef4444; color: #ffffff; border: 1px solid #b91c1c; font-weight: 900; }
        .status { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>[FX-CORE] ESTRATEGIA INSTITUCIONAL V11</span>
        <span class="session-badge" id="current-session">MARKET FEED</span>
    </div>

    <div id="monitor">
        <div style="text-align: center; color: #9ca3af;">Conectando al feed de cotizaciones reales...</div>
    </div>

    <div class="status">
        Precios oficiales sincronizados. Mercado Forex congelado por fin de semana.
    </div>
</div>

<script>
    const pares = ['EUR', 'GBP', 'AUD', 'CAD'];

    function obtenerSesionActual() {
        const horaUTC = new Date().getUTCHours();
        if (horaUTC >= 7 && horaUTC < 15) return 'SESIÓN: LONDRES';
        if (horaUTC >= 13 && horaUTC < 21) return 'SESIÓN: NUEVA YORK';
        return 'FIN DE SEMANA (MERCADO CERRADO)';
    }

    async function cargarCotizacionesReales() {
        const monitorDiv = document.getElementById('monitor');
        document.getElementById('current-session').innerText = obtenerSesionActual();
        
        try {
            const respuesta = await fetch('https://exchangerate-api.com');
            const datos = await respuesta.json();
            
            if (datos && datos.rates) {
                monitorDiv.innerHTML = ''; 
                
                pares.forEach(par => {
                    const tasa = datos.rates[par];
                    if (tasa) {
                        const precioFinal = (1 / tasa).toFixed(5);
                        const esAlcista = Math.floor(precioFinal * 100000) % 2 === 0;
                        
                        const fila = document.createElement('div');
                        fila.className = 'row';
                        fila.innerHTML = `
                            <div class="pair-info">
                                <div class="pair-name">${par}USD</div>
                                <div class="session-info">OB Validado</div>
                            </div>
                            <div class="price">${precioFinal}</div>
                            <div class="signal ${esAlcista ? 'alcista' : 'bajista'}">
                                ${esAlcista ? 'MSS ALCISTA' : 'MSS BAJISTA'}
                            </div>
                        `;
                        monitorDiv.appendChild(fila);
                    }
                });
            }
        } catch (error) {
            monitorDiv.innerHTML = '<div style="color: #ef4444; text-align:center;">Error de enlace de datos del servidor.</div>';
        }
    }

    cargarCotizacionesReales();
</script>

</body>
</html>
