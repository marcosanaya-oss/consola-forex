<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX-CORE | Terminal TradingView Realtime</title>
  
  <style>
    /* --- ESTILOS GENERALES INSTITUCIONALES --- */
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-container {
      width: 100%;
      max-width: 1200px;
      background-color: #131722;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .header-terminal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 15px;
    }

    .titulo-consola {
      font-size: 24px;
      font-weight: bold;
      color: #2962ff;
      letter-spacing: 1px;
      margin: 0;
    }

    .botones-nav {
      display: flex;
      gap: 10px;
    }

    /* --- ESTILOS DE LOS BOTONES --- */
    .btn-forex {
      background-color: #1e222d;
      color: #b2b5be;
      border: 1px solid #2a2e39;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-forex:hover {
      background-color: #2a2e39;
      color: #ffffff;
      border-color: #2962ff;
    }

    .btn-forex.active {
      background-color: #2962ff;
      color: #ffffff;
      border-color: #2962ff;
    }

    /* --- CONTENEDOR DEL GRÁFICO --- */
    .grafico-wrapper {
      width: 100%;
      height: 600px; 
      background-color: #131722;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #2a2e39;
      position: relative;
    }

    /* Controladores de visualización para capas estáticas */
    .capa-grafico {
      width: 100%;
      height: 100%;
      display: none; /* Ocultos por defecto */
    }

    .capa-grafico.visible {
      display: block; /* Solo se muestra el activo */
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="header-terminal">
      <h1 class="titulo-consola">FX-CORE TERMINAL</h1>
      
      <div class="botones-nav">
        <button class="btn-forex active" id="btn-EURUSD" onclick="mostrarGrafico('EURUSD')">EUR/USD</button>
        <button class="btn-forex" id="btn-GBPUSD" onclick="mostrarGrafico('GBPUSD')">GBP/USD</button>
        <button class="btn-forex" id="btn-USDCHF" onclick="mostrarGrafico('USDCHF')">USD/CHF</button>
      </div>
    </div>

    <!-- Área con cargas estáticas incrustadas directamente -->
    <div class="grafico-wrapper">
      
      <!-- Contenedor EURUSD -->
      <div id="grafico-EURUSD" class="capa-grafico visible">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://tradingview.com" async>
          {
            "autosize": true,
            "symbol": "FX:EURUSD",
            "interval": "5",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "allow_symbol_change": false,
            "calendar": false,
            "support_host": "https://tradingview.com"
          }
          </script>
        </div>
      </div>

      <!-- Contenedor GBPUSD -->
      <div id="grafico-GBPUSD" class="capa-grafico">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://tradingview.com" async>
          {
            "autosize": true,
            "symbol": "FX:GBPUSD",
            "interval": "5",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "allow_symbol_change": false,
            "calendar": false,
            "support_host": "https://tradingview.com"
          }
          </script>
        </div>
      </div>

      <!-- Contenedor USDCHF -->
      <div id="grafico-USDCHF" class="capa-grafico">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://tradingview.com" async>
          {
            "autosize": true,
            "symbol": "FX:USDCHF",
            "interval": "5",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "allow_symbol_change": false,
            "calendar": false,
            "support_host": "https://tradingview.com"
          }
          </script>
        </div>
      </div>

    </div>
  </div>

  <script type="text/javascript">
    function mostrarGrafico(parId) {
      // 1. Alternar clases activas de los botones de la interfaz
      document.querySelectorAll('.btn-forex').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + parId).classList.add('active');

      // 2. Alternar visibilidad de las capas HTML nativas
      document.querySelectorAll('.capa-grafico').forEach(capa => capa.classList.remove('visible'));
      document.getElementById('grafico-parId'.replace('parId', parId)).classList.add('visible');
    }
  </script>

</body>
</html>
