<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX-CORE | Terminal TradingView Realtime</title>
  
  <style>
    /* --- ESTILOS GENERALES INSTITUCIONALES --- */
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-container {
      width: 100%;
      max-width: 1200px;
      background-color: #131722;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .header-terminal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 15px;
    }

    .titulo-consola {
      font-size: 24px;
      font-weight: bold;
      color: #2962ff;
      letter-spacing: 1px;
      margin: 0;
    }

    .botones-nav {
      display: flex;
      gap: 10px;
    }

    /* --- ESTILOS DE LOS BOTONES --- */
    .btn-forex {
      background-color: #1e222d;
      color: #b2b5be;
      border: 1px solid #2a2e39;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-forex:hover {
      background-color: #2a2e39;
      color: #ffffff;
      border-color: #2962ff;
    }

    .btn-forex.active {
      background-color: #2962ff;
      color: #ffffff;
      border-color: #2962ff;
    }

    /* --- CONTENEDOR DEL GRÁFICO (REEMPLAZA EL IFRAME VIEJO) --- */
    .grafico-wrapper {
      width: 100%;
      height: 600px; /* Altura ideal de escritorio para análisis técnico */
      background-color: #131722;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #2a2e39;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <!-- Encabezado de la Consola Financiera -->
    <div class="header-terminal">
      <h1 class="titulo-consola">FX-CORE TERMINAL</h1>
      
      <!-- Panel de Selección de Divisas Interactivo -->
      <div class="botones-nav">
        <button class="btn-forex active" id="btn-EURUSD" onclick="cambiarPar('EURUSD')">EUR/USD</button>
        <button class="btn-forex" id="btn-GBPUSD" onclick="cambiarPar('GBPUSD')">GBP/USD</button>
        <button class="btn-forex" id="btn-USDCHF" onclick="cambiarPar('USDCHF')">USD/CHF</button>
      </div>
    </div>

    <!-- Área de Visualización del Gráfico en Tiempo Real -->
    <div class="grafico-wrapper">
      <div id="tradingview_chart" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <!-- Librería de renderizado oficial de TradingView sin restricciones de iframe -->
  <script type="text/javascript" src="https://tradingview.com"></script>
  
  <script type="text/javascript">
    // Función centralizada para inicializar y cambiar los pares del gráfico
    function cambiarPar(parCodigo) {
      
      // 1. Gestionar el estado visual de los botones activos
      document.querySelectorAll('.btn-forex').forEach(btn => btn.classList.remove('active'));
      const botonSeleccionado = document.getElementById('btn-' + parCodigo);
      if (botonSeleccionado) {
        botonSeleccionado.classList.add('active');
      }

      // 2. Instanciar el Widget oficial dentro del contenedor asignado
      new TradingView.widget({
        "autosize": true,
        "symbol": "FX:" + parCodigo, // Prefijo "FX:" para obtener datos de Forex compuestos y fluidos
        "interval": "5",             // Gráfico predeterminado en temporalidad de 5 minutos
        "timezone": "Etc/UTC",
        "theme": "dark",             // Tema oscuro para que combine con la UI institucional
        "style": "1",                // Estilo "1" representa gráfico de velas japonesas
        "locale": "es",
        "enable_publishing": false,
        "hide_side_toolbar": false,  // Muestra las herramientas de dibujo técnico a la izquierda
        "allow_symbol_change": true,
        "container_id": "tradingview_chart"
      });
    }

    // Evento de ciclo de vida: Inicializa el gráfico inmediatamente al cargar el DOM de la aplicación
    window.addEventListener('DOMContentLoaded', () => {
      cambiarPar('EURUSD');
    });
  </script>

</body>
</html>
