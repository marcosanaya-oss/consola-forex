<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX-CORE | Terminal TradingView Realtime</title>
  
  <style>
    /* --- CONFIGURACIÓN DE PANTALLA GENERAL --- */
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-container {
      width: 100%;
      max-width: 1200px;
      background-color: #131722;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .header-terminal {
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 15px;
    }

    .titulo-consola {
      font-size: 24px;
      font-weight: bold;
      color: #2962ff;
      letter-spacing: 1px;
      margin: 0;
    }

    /* --- CONTENEDOR FLUIDO DEL ENTORNO GRÁFICO --- */
    .contenedor-grafico-maestro {
      width: 100%;
      height: 650px; /* Altura ideal de escritorio para análisis técnico profesional */
      background-color: #1c2030;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #2a2e39;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <!-- Encabezado Institucional -->
    <div class="header-terminal">
      <h1 class="titulo-consola">FX-CORE TERMINAL</h1>
    </div>

    <!-- Área de Visualización en Tiempo Real Avanzada -->
    <div class="contenedor-grafico-maestro">
      <!-- Iframe nativo con lista de seguimiento (Watchlist) integrada para EURUSD, GBPUSD y USDCHF -->
      <iframe 
        src="https://tradingview.com" 
        scrolling="no" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
