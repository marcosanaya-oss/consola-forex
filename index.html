<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX-CORE | Monitor de Señales</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
        }
        .header {
            font-size: 14px;
            font-weight: bold;
            color: #10b981;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8px;
            border-bottom: 1px solid #1f2937;
        }
        .pair { font-weight: 600; width: 25%; }
        .price { font-family: monospace; width: 30%; text-align: right; padding-right: 15px; }
        .signal {
            width: 25%;
            text-align: center;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .alcista { background-color: #065f46; color: #34d399; }
        .bajista { background-color: #991b1b; color: #f87171; }
        .btn-operar {
            background-color: #1e3a8a;
            color: #60a5fa;
            border: 1px solid #2563eb;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .status { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        const respuesta = await fetch('https://exchangerate-api.com');

        <span style="color: #3b82f6;">DATA LIVE</span>
    </div>

    <div id="monitor">
        <!-- Las filas de Forex se inyectan dinámicamente aquí -->
    </div>

    <div class="status">
        Actualizado automáticamente cada 60s vía API Pública
    </div>
</div>

<script>
    // Lista de pares a monitorizar
    const pares = ['EUR', 'GBP', 'CHF', 'JPY'];
    
    async function actualizarSenales() {
        const monitorDiv = document.getElementById('monitor');
        
        try {
            // Usamos una API gratuita de tipos de cambio con base en USD
            const respuesta = await fetch('https://er-api.com');
            const datos = await respuesta.json();
            
            if (datos.result === "success") {
                monitorDiv.innerHTML = ''; // Limpiar datos anteriores
                
                pares.forEach(par => {
                    const tasa = datos.rates[par];
                    // Formatear el par inverso para mostrar la cotización estándar (ej. EURUSD)
                    const precioFinal = (1 / tasa).toFixed(5);
                    
                    // Lógica algorítmica simple: Si el último dígito es par o impar define la señal simulada
                    // Reemplazar esta condición con tu estrategia técnica personalizada si es necesario
                    const esAlcista = Math.floor(precioFinal * 100000) % 2 === 0;
                    
                    const fila = document.createElement('div');
                    fila.className = 'row';
                    fila.innerHTML = `
                        <div class="pair">${par}USD</div>
                        <div class="price">${precioFinal}</div>
                        <div class="signal ${esAlcista ? 'alcista' : 'bajista'}">
                            ${esAlcista ? 'ALCISTA' : 'BAJISTA'}
                        </div>
                        <button class="btn-operar">⚡ OPERAR</button>
                    `;
                    monitorDiv.appendChild(fila);
                });
            }
        } catch (error) {
            monitorDiv.innerHTML = '<div style="color: #ef4444; text-align:center;">Error al conectar con el proveedor de datos.</div>';
        }
    }

    // Ejecutar al cargar la página y repetir cada 60 segundos
    actualizarSenales();
    setInterval(actualizarSenales, 60000);
</script>

</body>
</html>
