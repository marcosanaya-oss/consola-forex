<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[FX-CORE] ESTRATEGIA INSTITUCIONAL V11</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
        }
        .header {
            font-size: 14px;
            font-weight: bold;
            color: #10b981;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-badge {
            background-color: #1e3a8a;
            color: #60a5fa;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        .widget-wrapper {
            margin-bottom: 15px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1f2937;
            background: #131722;
        }
        .status { 
            font-size: 11px; 
            color: #9ca3af; 
            text-align: center; 
            margin-top: 20px; 
            border-top: 1px solid #1f2937;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>[FX-CORE] INTERFAZ DE ACTIVOS REALTIME V11</span>
        <span class="session-badge" id="current-session">MARKET FEED</span>
    </div>

    <!-- WIDGET TRADINGVIEW FLUX -->
    <div class="widget-wrapper">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://tradingview.com" async>
            {
            "symbols": [
                { "proName": "FX:EURUSD", "title": "EURUSD" },
                { "proName": "FX:GBPUSD", "title": "GBPUSD" },
                { "proName": "FX:AUDUSD", "title": "AUDUSD" },
                { "proName": "FX:XAUUSD", "title": "XAUUSD (ORO)" }
            ],
            "colorTheme": "dark",
            "isTransparent": true,
            "showSymbolLogo": true,
            "locale": "es"
            }
            </script>
        </div>
    </div>

    <!-- COMPONENTE COMPLETO DE SEÑALES ASOCIADAS -->
    <div class="widget-wrapper" style="height: 400px;">
        <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
            <div class="tradingview-widget-container__widget" style="height: calc(100% - 32px); width: 100%;"></div>
            <script type="text/javascript" src="https://tradingview.com" async>
            {
            "width": "100%",
            "height": "100%",
            "symbolsGroups": [
                {
                "name": "Estructura Institucional [FX-CORE]",
                "originalName": "Forex",
                "symbols": [
                    { "name": "FX:EURUSD", "displayName": "EURUSD | MSS" },
                    { "name": "FX:GBPUSD", "displayName": "GBPUSD | MSS" },
                    { "name": "FX:AUDUSD", "displayName": "AUDUSD | MSS" },
                    { "name": "FX:XAUUSD", "displayName": "XAUUSD | ORO" }
                ]
                }
            ],
            "showSymbolLogo": true,
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "es"
            }
            </script>
        </div>
    </div>

    <div class="status">
        Conexión directa establecida mediante servidores de TradingView Core v11
    </div>
</div>

<script>
    function obtenerSesionActual() {
        const horaUTC = new Date().getUTCHours();
        if (horaUTC >= 7 && horaUTC < 15) return 'SESIÓN: LONDRES';
        if (horaUTC >= 13 && horaUTC < 21) return 'SESIÓN: NUEVA YORK';
        return 'FIN DE SEMANA (MERCADO CERRADO)';
    }
    document.getElementById('current-session').innerText = obtenerSesionActual();
</script>

</body>
</html>
