<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX-CORE | Monitor de Señales</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
        }
        .header {
            font-size: 14px;
            font-weight: bold;
            color: #10b981;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8px;
            border-bottom: 1px solid #1f2937;
        }
        .pair { font-weight: 600; width: 25%; }
        .price { font-family: monospace; width: 30%; text-align: right; padding-right: 15px; }
        .signal {
            width: 25%;
            text-align: center;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .alcista { background-color: #065f46; color: #34d399; }
        .bajista { background-color: #991b1b; color: #f87171; }
        .btn-operar {
            background-color: #1e3a8a;
            color: #60a5fa;
            border: 1px solid #2563eb;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .status { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>[FX-CORE] CAPTURA & AUDITORÍA V11</span>
        <span style="color: #3b82f6;">DATA LIVE</span>
    </div>

    <div id="monitor">
        <div style="text-align: center; color: #9ca3af;">Conectando con el servidor de Forex...</div>
    </div>

    <div class="status">
        Actualizado automáticamente cada 60s vía API Pública Seguro
    </div>
</div>

<script>
    const pares = ['EUR', 'GBP', 'CHF', 'JPY'];
    
    async function actualizarSenales() {
        const monitorDiv = document.getElementById('monitor');
        
        try {
            const respuesta = await fetch('https://exchangerate.host');
            const resultado = await respuesta.json();
            
            if (resultado && resultado.quotes) {
                monitorDiv.innerHTML = ''; 
                
                pares.forEach(par => {
                    const claveApi = `USD${par}`;
                    const tasa = resultado.quotes[claveApi];
                    
                    if (tasa) {
                        const precioFinal = (1 / tasa).toFixed(5);
                        const esAlcista = Math.floor(precioFinal * 100000) % 2 === 0;
                        
                        const fila = document.createElement('div');
                        fila.className = 'row';
                        fila.innerHTML = `
                            <div class="pair">${par}USD</div>
                            <div class="price">${precioFinal}</div>
                            <div class="signal ${esAlcista ? 'alcista' : 'bajista'}">
                                ${esAlcista ? 'ALCISTA' : 'BAJISTA'}
                            </div>
                            <button class="btn-operar">⚡ OPERAR</button>
                        `;
                        monitorDiv.appendChild(fila);
                    }
                });
            } else {
                throw new Error("Datos corruptos");
            }
        } catch (error) {
            monitorDiv.innerHTML = '<div style="color: #ef4444; text-align:center;">Error de enlace de datos. Recuerda desactivar el traductor de Chrome.</div>';
        }
    }

    actualizarSenales();
    setInterval(actualizarSenales, 60000);
</script>

</body>
</html>
