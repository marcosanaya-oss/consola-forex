<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX-CORE | Terminal TradingView Realtime</title>
  
  <style>
    /* --- CONFIGURACIÓN DE PANTALLA --- */
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-container {
      width: 100%;
      max-width: 1200px;
      background-color: #131722;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .header-terminal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 15px;
    }

    .titulo-consola {
      font-size: 24px;
      font-weight: bold;
      color: #2962ff;
      letter-spacing: 1px;
      margin: 0;
    }

    /* --- PANEL DE CONTROLES (REFRESCO) --- */
    .panel-controles {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .select-tiempo {
      background-color: #1c2030;
      color: #ffffff;
      border: 1px solid #2a2e39;
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-refrescar {
      background-color: #2962ff;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-refrescar:hover {
      background-color: #194fd3;
    }

    /* --- PANEL GRID REORGANIZADO --- */
    .dashboard-forex {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .tarjeta-divisa {
      background-color: #1c2030;
      border: 1px solid #2a2e39;
      border-radius: 6px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .tarjeta-divisa h3 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #b2b5be;
      letter-spacing: 0.5px;
    }

    .precio-valor {
      font-size: 38px;
      font-weight: bold;
      color: #ffffff;
      transition: color 0.2s ease-in-out;
    }

    .estado-actualizacion {
      font-size: 12px;
      color: #5d606b;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="header-terminal">
      <h1 class="titulo-consola">FX-CORE TERMINAL</h1>
      
      <!-- Panel de control de refresco temporal -->
      <div class="panel-controles">
        <select id="selectorIntervalo" class="select-tiempo" onchange="configurarTemporizador()">
          <option value="0">Refresco Manual</option>
          <option value="5000" selected>Cada 5 Segundos</option>
          <option value="10000">Cada 10 Segundos</option>
          <option value="30000">Cada 30 Segundos</option>
        </select>
        
        <button class="btn-refrescar" onclick="actualizarTodo()">🔄 Actualizar Ahora</button>
      </div>
    </div>

    <!-- Interfaz de datos puros nativos -->
    <div class="dashboard-forex">
      
      <div class="tarjeta-divisa">
        <h3>EUR / USD</h3>
        <div id="precio-EURUSD" class="precio-valor">0.0000</div>
        <div id="tiempo-EURUSD" class="estado-actualizacion">Conectando...</div>
      </div>

      <div class="tarjeta-divisa">
        <h3>GBP / USD</h3>
        <div id="precio-GBPUSD" class="precio-valor">0.0000</div>
        <div id="tiempo-GBPUSD" class="estado-actualizacion">Conectando...</div>
      </div>

      <div class="tarjeta-divisa">
        <h3>USD / CHF</h3>
        <div id="precio-USDCHF" class="precio-valor">0.0000</div>
        <div id="tiempo-USDCHF" class="estado-actualizacion">Conectando...</div>
      </div>

    </div>
  </div>

  <script type="text/javascript">
    let loopAutomatico = null;
    let preciosPrevios = { EURUSD: 0, GBPUSD: 0, USDCHF: 0 };

    // API descentralizada abierta (No genera bloqueos de CORS en navegadores)
    async function obtenerPrecioReal(urlApi, tickerId) {
      try {
        const respuesta = await fetch(urlApi);
        if (!respuesta.ok) throw new Error();
        
        const json = await respuesta.json();
        
        // Procesamiento matemático dinámico del JSON según la estructura del nodo
        let precioActual = 0;
        if (json.bitcoin) {
          // Relación cruzada de divisas estables para USD/CHF si aplica
          precioActual = json.bitcoin.chf ? (json.bitcoin.usd / json.bitcoin.chf) : parseFloat(json.data.amount);
        } else if (json.data && json.data.amount) {
          precioActual = parseFloat(json.data.amount);
        }

        renderizarUI(tickerId, precioActual);
      } catch (error) {
        document.getElementById(`precio-${tickerId}`).innerText = "---";
        document.getElementById(`tiempo-${tickerId}`).innerText = "Reintentando...";
      }
    }

    function renderizarUI(id, precio) {
      const elPrecio = document.getElementById(`precio-${id}`);
      const elTiempo = document.getElementById(`tiempo-${id}`);
      
      const ahora = new Date();
      elTiempo.innerText = `Actualizado: ${ahora.toLocaleTimeString()}`;
      elPrecio.innerText = precio.toFixed(4);

      // Fluctuación de color visual en tiempo de ejecución (Verde/Rojo)
      if (preciosPrevios[id] > 0) {
        if (precio > preciosPrevios[id]) {
          elPrecio.style.color = "#00e676";
        } else if (precio < preciosPrevios[id]) {
          elPrecio.style.color = "#ff5252";
        }
        setTimeout(() => { elPrecio.style.color = "#ffffff"; }, 800);
      }
      preciosPrevios[id] = precio;
    }

    // Orquestador maestro de conexiones de red
    function actualizarTodo() {
      // Usamos Coinbase Pro Api y Coingecko API que permiten consultas de Forex cruzadas libres de restricciones origen
      obtenerPrecioReal("https://coinbase.com", "EURUSD");
      obtenerPrecioReal("https://coinbase.com", "GBPUSD");
      obtenerPrecioReal("https://coingecko.com", "USDCHF");
    }

    function configurarTemporizador() {
      if (loopAutomatico) clearInterval(loopAutomatico);
      const milisegundos = parseInt(document.getElementById("selectorIntervalo").value);
      if (milisegundos > 0) {
        loopAutomatico = setInterval(actualizarTodo, milisegundos);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      actualizarTodo();
      configurarTemporizador();
    });
  </script>

</body>
</html>
