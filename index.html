<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX-CORE | Terminal Multiactivo v15.3</title>
    <style>
        /* --- ESTILOS GENERALES Y PANEL OSCURO --- */
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: #131a26;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        /* --- SELECTOR DE DIVISAS --- */
        .selector-box {
            display: flex;
            gap: 10px;
        }

        .pair-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .pair-btn:hover {
            border-color: #38bdf8;
            color: #ffffff;
        }

        .pair-btn.active {
            background: #38bdf8;
            color: #0b0f19;
            border-color: #38bdf8;
        }

        /* --- PANELES DE DATOS EN TIEMPO REAL --- */
        .market-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .data-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
        }

        .data-card label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .data-card value {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: monospace;
        }

        /* --- PANELES DE ALERTAS DINÁMICAS (MSS) --- */
        #alert-panel {
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .alert-neutral {
            background-color: #1e222d;
            border-left: 6px solid #707a8a;
            color: #94a3b8;
        }

        .alert-bullish {
            background-color: rgba(14, 203, 129, 0.1);
            border-left: 6px solid #0ecb81;
            border-color: rgba(14, 203, 129, 0.2);
            color: #0ecb81;
            animation: pulse 2s infinite;
        }

        .alert-bearish {
            background-color: rgba(246, 70, 93, 0.1);
            border-left: 6px solid #f6465d;
            border-color: rgba(246, 70, 93, 0.2);
            color: #f6465d;
            animation: pulse 2s infinite;
        }

        .alert-title {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .alert-details {
            font-size: 1rem;
            font-weight: normal;
            color: #ffffff;
            margin-top: 10px;
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; }
            100% { opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FX-CORE TERMINAL</h1>
            <!-- Selectores dinámicos de divisas -->
            <div class="selector-box">
                <button class="pair-btn active" onclick="cambiarPar('OANDA:EUR_USD')">EUR/USD</button>
                <button class="pair-btn" onclick="cambiarPar('OANDA:GBP_USD')">GBP/USD</button>
                <button class="pair-btn" onclick="cambiarPar('OANDA:USD_CHF')">USD/CHF</button>
            </div>
        </header>

        <!-- Datos de Mercado -->
        <div class="market-data">
            <div class="data-card">
                <label>Precio Actual</label>
                <value id="current-price">0.00000</value>
            </div>
            <div class="data-card">
                <label>Filtro EMA Institucional</label>
                <value id="ema-value" style="color: #38bdf8;">0.00000</value>
            </div>
        </div>

        <!-- Consola de Alertas Estructura Shift -->
        <div id="alert-panel" class="alert-neutral">
            <div class="alert-title">
                <span id="signal-type">CONECTANDO CON FINNHUB...</span>
            </div>
            <div class="alert-details" id="signal-details">
                Esperando ticks de mercado para inicializar algoritmos.
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURACIÓN: Reemplaza con tu Token Gratuito de Finnhub
        // =========================================================================
        const apiKey = "TU_API_KEY_AQUÍ"; 
        
        // Estructura de almacenamiento independiente para cada par de divisas
        const parConfig = {
            "OANDA:EUR_USD": { pricesLog: [], lastHigh: 0, lastLow: Infinity, currentEma: 0 },
            "OANDA:GBP_USD": { pricesLog: [], lastHigh: 0, lastLow: Infinity, currentEma: 0 },
            "OANDA:USD_CHF": { pricesLog: [], lastHigh: 0, lastLow: Infinity, currentEma: 0 }
        };

        let parActivo = "OANDA:EUR_USD"; // Par visualizado por defecto
        const maxLogLength = 20;
        const emaPeriod = 9;

        // --- ENLACE WEBSOCKET PROFESIONAL ---
        const ws = new WebSocket(`wss://ws.finnhub.io?token=${apiKey}`);

        ws.onopen = () => {
            console.log("Conectado con éxito a Finnhub Forex Engine.");
            // Suscribirse de manera simultánea a los 3 pares institucionales
            Object.keys(parConfig).forEach(symbol => {
                ws.send(JSON.stringify({ 'type': 'subscribe', 'symbol': symbol }));
            });
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            
            if (response.type === 'trade') {
                response.data.forEach(tick => {
                    const symbol = tick.s;
                    const price = parseFloat(tick.p);
                    
                    if (parConfig[symbol]) {
                        procesarMotorTrading(symbol, price);
                    }
                });
            }
        };

        // --- MOTOR DE TRADING INSTITUCIONAL CENTRALIZADO ---
        function procesarMotorTrading(symbol, price) {
            const data = parConfig[symbol];
            data.pricesLog.push(price);
            if (data.pricesLog.length > maxLogLength) data.pricesLog.shift();

            // Calcular Media Móvil Exponencial (EMA)
            if (data.pricesLog.length >= emaPeriod) {
                if (data.currentEma === 0) {
                    data.currentEma = data.pricesLog.slice(0, emaPeriod).reduce((a, b) => a + b) / emaPeriod;
                } else {
                    const k = 2 / (emaPeriod + 1);
                    data.currentEma = price * k + data.currentEma * (1 - k);
                }
            }

            // Lógica de Rastreo de Estructuras (Máximos y Mínimos Locales)
            if (data.pricesLog.length > 5) {
                const localHigh = Math.max(...data.pricesLog.slice(-5));
                const localLow = Math.min(...data.pricesLog.slice(-5));

                if (localHigh > data.lastHigh) data.lastHigh = localHigh;
                if (localLow < data.lastLow) data.lastLow = localLow;

                // Detección de Rupturas Estructurales (MSS) en base a tu captura de TradingView
                if (price > data.lastHigh && price > data.currentEma && data.currentEma > 0) {
                    data.lastHigh = price; // Actualizar estructura
                    if (symbol === parActivo) actualizarPantallaAlertas('ALCISTA', price, localLow);
                } 
                else if (price < data.lastLow && price < data.currentEma && data.currentEma > 0) {
                    data.lastLow = price; // Actualizar estructura
                    if (symbol === parActivo) actualizarPantallaAlertas('BAJISTA', price, localHigh);
                }
            }

            // Si el tick pertenece al par que el usuario está viendo, actualiza la pantalla principal
            if (symbol === parActivo) {
                // Ajuste de precisión de decimales típico de Forex (5 decimales)
                document.getElementById('current-price').innerText = price.toFixed(5);
                document.getElementById('ema-value').innerText = data.currentEma > 0 ? data.currentEma.toFixed(5) : "Calculando...";
            }
        }

        // --- INTERFAZ DINÁMICA: CAMBIO DE PESTAÑA ---
        function cambiarPar(nuevoPar) {
            parActivo = nuevoPar;
            
            // Cambiar estilos de los botones del menú superior
