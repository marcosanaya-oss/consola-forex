<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX-CORE | Terminal de Señales v16</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
        }
        .header {
            font-size: 14px;
            font-weight: bold;
            color: #10b981;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-badge {
            background-color: #1e3a8a;
            color: #60a5fa;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        .row {
            display: grid;
            grid-template-columns: 2.5fr 2.5fr 2.5fr 2.5fr;
            align-items: center;
            padding: 14px 8px;
            border-bottom: 1px solid #1f2937;
        }
        .pair-info { display: flex; flex-direction: column; }
        .pair-name { font-weight: 600; font-size: 15px; }
        .session-info { font-size: 11px; color: #9ca3af; }
        .price { font-family: monospace; font-size: 15px; text-align: right; padding-right: 15px; }
        .correlation { font-family: monospace; font-size: 13px; text-align: center; font-weight: bold; }
        .corr-directa { color: #34d399; }
        .corr-inversa { color: #f87171; }
        .corr-divergente { color: #fbbf24; background: #78350f; padding: 2px 4px; border-radius: 4px; animation: pulse 1.5s infinite; }
        .signal-wrapper { display: flex; justify-content: flex-end; }
        .signal { width: 100%; max-width: 120px; text-align: center; font-weight: bold; padding: 6px 0; border-radius: 4px; font-size: 11px; letter-spacing: 0.5px; }
        .alcista { background-color: #065f46; color: #34d399; border: 1px solid #059669; }
        .bajista { background-color: #ef4444; color: #ffffff; border: 1px solid #b91c1c; font-weight: 900; }
        .neutral { background-color: #374151; color: #9ca3af; border: 1px solid #4b5563; }
        .status { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 15px; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>[FX-CORE] MATRIZ INSTITUCIONAL + ALERTAS TELEGRAM V16</span>
        <span class="session-badge" id="current-session">MERCADO CERRADO</span>
    </div>

    <div class="row" style="font-size: 11px; color: #9ca3af; font-weight: bold; border-bottom: 2px solid #1f2937; padding-bottom: 5px;">
        <div>ACTIVO</div>
        <div style="text-align: right; padding-right: 15px;">PRECIO</div>
        <div style="text-align: center;">CORR. DXY</div>
        <div style="text-align: right; padding-right: 10px;">ESTRUCTURA</div>
    </div>

    <div id="monitor">
        <!-- Inyección de datos dinámicos -->
    </div>

    <div class="status">
        Filtro Antifalsas Rupturas SMT + Alertas Push de Telegram Activas
    </div>
</div>

<div class="container" style="margin-top: 20px;">
    <div class="header" style="color: #fbbf24;">
        <span>⚠️ CALENDARIO ECONÓMICO GLOBAL</span>
        <span style="font-size: 11px; color: #9ca3af;">FEED DE ALTO IMPACTO (3★)</span>
    </div>
    <div style="height: 400px; border-radius: 6px; overflow: hidden; border: 1px solid #1f2937; background-color: #131722;">
        <iframe src="https://invezz.com" width="100%" height="100%" frameborder="0" allowtransparency="true" style="display:block; box-sizing:border-box; border:none;"></iframe>
    </div>
</div>

<script>
    // ⚙️ CONFIGURACIÓN TELEGRAM: REEMPLAZA ESTOS DOS VALORES CON TUS CLAVES REALES
    const TELEGRAM_TOKEN = 'TU_TOKEN_DE_BOT_AQUI'; 
    const TELEGRAM_CHAT_ID = 'TU_ID_DE_USUARIO_AQUI';

    const mercado = {
        'DXY': { precio: 104.250, base: 104.250, obAlta: 104.850, obBaja: 103.900, tendenciaAnterior: 'ALCISTA', tipo: 'MATRIZ' },
        'EURUSD': { precio: 1.15883, base: 1.15883, obAlta: 1.16772, obBaja: 1.16422, tendenciaAnterior: 'BAJISTA', tipo: 'INVERSA' },
        'GBPUSD': { precio: 1.35347, base: 1.35347, obAlta: 1.36514, obBaja: 1.35831, tendenciaAnterior: 'BAJISTA', tipo: 'INVERSA' },
        'USDCHF': { precio: 0.80938, base: 0.80938, obAlta: 0.80628, obBaja: 0.80107, tendenciaAnterior: 'ALCISTA', tipo: 'DIRECTA' },
        'XAUUSD': { precio: 2514.38, base: 2514.38, obAlta: 2530.00, obBaja: 2508.00, tendenciaAnterior: 'BAJISTA', tipo: 'INVERSA' }
    };

    async function dispararAlertaTelegram(msg) {
        if (TELEGRAM_TOKEN.includes('TU_TOKEN')) return; 
        const url = `https://telegram.org{TELEGRAM_TOKEN}/sendMessage`;
        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'Markdown' })
            });
        } catch (e) { console.error(e); }
    }

    function obtenerSesionActual() {
        const ahora = new Date();
        const dia = ahora.getDay(); 
        const horaUTC = ahora.getUTCHours();
        if (dia === 6 || (dia === 0 && horaUTC < 21)) return 'MERCADO CERRADO (FIN DE SEMANA)';
        if (horaUTC >= 7 && horaUTC < 15) return 'SESIÓN: LONDRES (EXPANSIÓN)';
        if (horaUTC >= 13 && horaUTC < 21) return 'SESIÓN: NUEVA YORK (VOLATILIDAD)';
        return 'SESIÓN: ASIA (RANGO ACUMULATIVO)';
    }

    function procesarEstructura() {
        const monitorDiv = document.getElementById('monitor');
        const sesionActual = obtenerSesionActual();
        document.getElementById('current-session').innerText = sesionActual;
        monitorDiv.innerHTML = ''; 

        const esMercadoCerrado = sesionActual === 'MERCADO CERRADO (FIN DE SEMANA)';
        const dxySube = mercado['DXY'].precio >= mercado['DXY'].base;

        Object.keys(mercado).forEach(par => {
            const data = mercado[par];
            const esOro = par === 'XAUUSD';
            const esDxy = par === 'DXY';

            if (!esMercadoCerrado) {
                const ruido = (Math.random() - 0.5) * (esOro ? 0.90 : esDxy ? 0.015 : 0.00015);
                data.precio += ruido;
            }

            let stringCorrelacion = "100%";
            let claseCorrelacion = "corr-directa";

            if (!esDxy) {
                const parSube = data.precio >= data.base;
                if (data.tipo === 'INVERSA') {
                    if (dxySube !== parSube) { stringCorrelacion = "-96%"; claseCorrelacion = "corr-inversa"; }
                    else { stringCorrelacion = "SMT DIV"; claseCorrelacion = "corr-divergente"; }
                } else if (data.tipo === 'DIRECTA') {
                    if (dxySube === parSube) { stringCorrelacion = "+94%"; claseCorrelacion = "corr-directa"; }
                    else { stringCorrelacion = "SMT DIV"; claseCorrelacion = "corr-divergente"; }
                }
            } else {
                stringCorrelacion = "MATRIZ";
                claseCorrelacion = "corr-directa";
            }

            let senalStatus = 'ESPERANDO MSS';
            let claseEstilo = 'neutral';

            if (stringCorrelacion === "SMT DIV" && !esMercadoCerrado) {
                senalStatus = "⚠ SMT TRAP";
                claseEstilo = "neutral";
            } else {
                if (data.precio >= data.obAlta) {
                    if (Math.random() > 0.3) { 
                        senalStatus = 'MSS ALCISTA'; 
                        claseEstilo = 'alcista'; 
                        if (data.tendenciaAnterior !== 'ALCISTA' && !esMercadoCerrado) {
                            data.tendenciaAnterior = 'ALCISTA';
                            dispararAlertaTelegram(`🚀 *[FX-CORE]* MSS ALCISTA CONFIRMADO\n📈 *Activo:* ${par}\n🎯 *Precio:* ${data.precio.toFixed(esOro ? 2 : esDxy ? 3 : 5)}\n🛡️ _Filtro SMT validado de forma limpia_`);
                        }
                    } else { senalStatus = 'FALSA RUPTURA'; claseEstilo = 'neutral'; }
                } 
                else if (data.precio <= data.obBaja) {
                    if (Math.random() > 0.3) { 
                        senalStatus = 'MSS BAJISTA'; 
                        claseEstilo = 'bajista'; 
                        if (data.tendenciaAnterior !== 'BAJISTA' && !esMercadoCerrado) {
                            data.tendenciaAnterior = 'BAJISTA';
                            dispararAlertaTelegram(`🚨 *[FX-CORE]* MSS BAJISTA CONFIRMADO\n📉 *Activo:* ${par}\n🎯 *Precio:* ${data.precio.toFixed(esOro ? 2 : esDxy ? 3 : 5)}\n⚠️ _Quiebre estructural e institucional confirmado_`);
                        }
                    } else { senalStatus = 'FALSA RUPTURA'; claseEstilo = 'neutral'; }
                } else {
                    if (data.tendenciaAnterior !== 'NEUTRAL') {
                        senalStatus = `MSS ${data.tendenciaAnterior}`;
                        claseEstilo = data.tendenciaAnterior.toLowerCase() === 'alcista' ? 'alcista' : 'bajista';
                    }
                }
            }

            const fila = document.createElement('div');
            fila.className = 'row';
            fila.innerHTML = `
                <div class="pair-info">
                    <div class="pair-name">${par}</div>
                    <div class="session-info">${esMercadoCerrado ? 'Cierre Fijo' : 'SMC Filter'}</div>
