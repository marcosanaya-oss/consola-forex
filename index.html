<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX-CORE | Terminal TradingView Realtime</title>
  
  <style>
    /* --- ESTILOS GENERALES INSTITUCIONALES --- */
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-container {
      width: 100%;
      max-width: 1200px;
      background-color: #131722;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .header-terminal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 15px;
    }

    .titulo-consola {
      font-size: 24px;
      font-weight: bold;
      color: #2962ff;
      letter-spacing: 1px;
      margin: 0;
    }

    /* --- CONTENEDOR DE TARJETAS FINANCIERAS EN LINEA --- */
    .dashboard-forex {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      margin-top: 10px;
    }

    .tarjeta-divisa {
      background-color: #1c2030;
      border: 1px solid #2a2e39;
      border-radius: 6px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .tarjeta-divisa h3 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #b2b5be;
      letter-spacing: 0.5px;
    }

    .precio-valor {
      font-size: 36px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 10px;
      transition: color 0.2s ease-in-out;
    }

    .variacion-valor {
      font-size: 16px;
      font-weight: 600;
      color: #b2b5be;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <!-- Encabezado de la Terminal -->
    <div class="header-terminal">
      <h1 class="titulo-consola">FX-CORE TERMINAL</h1>
    </div>

    <!-- Panel de Cotizaciones en Vivo sin Bloqueos de Seguridad -->
    <div class="dashboard-forex">
      
      <!-- Bloque EUR/USD -->
      <div class="tarjeta-divisa">
        <h3>EUR / USD</h3>
        <div id="precio-EURUSD" class="precio-valor">0.0000</div>
        <div id="cambio-EURUSD" class="variacion-valor">0.00%</div>
      </div>

      <!-- Bloque GBP/USD -->
      <div class="tarjeta-divisa">
        <h3>GBP / USD</h3>
        <div id="precio-GBPUSD" class="precio-valor">0.0000</div>
        <div id="cambio-GBPUSD" class="variacion-valor">0.00%</div>
      </div>

      <!-- Bloque USD/CHF -->
      <div class="tarjeta-divisa">
        <h3>USD / CHF</h3>
        <div id="precio-USDCHF" class="precio-valor">0.0000</div>
        <div id="cambio-USDCHF" class="variacion-valor">0.00%</div>
      </div>

    </div>
  </div>

  <!-- MOTOR DE EXTRACCIÓN DE DATOS (JAVASCRIPT INTEGRADO) -->
  <script type="text/javascript">
    const PARES = ["EURUSD", "GBPUSD", "USDCHF"];
    const INTERVALO = 4000; // Actualización balanceada cada 4 segundos
    let preciosPrevios = { EURUSD: 0, GBPUSD: 0, USDCHF: 0 };

    async function consumirApiFinanciera(par) {
      // Endpoint financiero encapsulado dentro de un resolver CORS libre de restricciones
      const urlDestino = `https://financeyahoo.com{par}=X?interval=1m&range=1d`;
      const apiEndpoint = `https://allorigins.win{encodeURIComponent(urlDestino)}`;

      try {
        const respuesta = await fetch(apiEndpoint);
        if (!respuesta.ok) throw new Error();
        
        const paquete = await respuesta.json();
        const objetoMercado = JSON.parse(paquete.contents);
        
        const metadatos = objetoMercado.chart.result[0].meta;
        const precioActual = metadatos.regularMarketPrice;
        const cierreAnterior = metadatos.previousClose;
        
        // Cálculo estricto del porcentaje diario
        const cambioPorcentaje = (((precioActual - cierreAnterior) / cierreAnterior) * 100).toFixed(2);

        renderizarPrecios(par, precioActual, cambioPorcentaje);
      } catch (err) {
        console.warn(`[Auditoría] Error de sincronización de red en par: ${par}`);
        const nodoError = document.getElementById(`precio-${par}`);
        if(nodoError) nodoError.innerText = "Sincronizando...";
      }
    }

    function renderizarPrecios(par, precio, variacion) {
      const elPrecio = document.getElementById(`precio-${par}`);
      const elCambio = document.getElementById(`cambio-${par}`);
      
      if (!elPrecio || !elCambio) return;

      // Inyección estricta del valor formateado a decimales de Forex
      elPrecio.innerText = precio.toFixed(4);
      const prefijoSigno = variacion > 0 ? "+" : "";
      elCambio.innerText = `${prefijoSigno}${variacion}%`;

      // Flujo de comportamiento visual (Verde Alcista / Rojo Bajista)
      if (preciosPrevios[par] > 0) {
        if (precio > preciosPrevios[par]) {
          elPrecio.style.color = "#00e676";
        } else if (precio < preciosPrevios[par]) {
          elPrecio.style.color = "#ff5252";
        }
        setTimeout(() => { elPrecio.style.color = "#ffffff"; }, 900);
      }

      // Estilo permanente para la tasa de variación
      if (variacion > 0) {
        elCambio.style.color = "#00e676";
      } else if (variacion < 0) {
        elCambio.style.color = "#ff5252";
      } else {
        elCambio.style.color = "#b2b5be";
      }

      preciosPrevios[par] = precio;
    }

    function inicializarTerminal() {
      PARES.forEach(p => consumirApiFinanciera(p));
      setInterval(() => {
        PARES.forEach(p => consumirApiFinanciera(p));
      }, INTERVALO);
    }

    window.addEventListener("DOMContentLoaded", inicializarTerminal);
  </script>

</body>
</html>
