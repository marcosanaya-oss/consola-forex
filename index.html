<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX-CORE | Terminal TradingView Realtime</title>
  
  <style>
    /* --- ESTILOS GENERALES INSTITUCIONALES --- */
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-container {
      width: 100%;
      max-width: 1200px;
      background-color: #131722;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .header-terminal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 15px;
    }

    .titulo-consola {
      font-size: 24px;
      font-weight: bold;
      color: #2962ff;
      letter-spacing: 1px;
      margin: 0;
    }

    .botones-nav {
      display: flex;
      gap: 10px;
    }

    /* --- ESTILOS DE LOS BOTONES --- */
    .btn-forex {
      background-color: #1e222d;
      color: #b2b5be;
      border: 1px solid #2a2e39;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-forex:hover {
      background-color: #2a2e39;
      color: #ffffff;
      border-color: #2962ff;
    }

    .btn-forex.active {
      background-color: #2962ff;
      color: #ffffff;
      border-color: #2962ff;
    }

    /* --- CONTENEDOR DEL GRÁFICO --- */
    .grafico-wrapper {
      width: 100%;
      height: 600px; 
      background-color: #131722;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #2a2e39;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="header-terminal">
      <h1 class="titulo-consola">FX-CORE TERMINAL</h1>
      
      <div class="botones-nav">
        <button class="btn-forex active" id="btn-EURUSD" onclick="cambiarPar('FX:EURUSD')">EUR/USD</button>
        <button class="btn-forex" id="btn-GBPUSD" onclick="cambiarPar('FX:GBPUSD')">GBP/USD</button>
        <button class="btn-forex" id="btn-USDCHF" onclick="cambiarPar('FX:USDCHF')">USD/CHF</button>
      </div>
    </div>

    <!-- Área limpia de inyección -->
    <div class="grafico-wrapper" id="contenedor-bloque-grafico">
      <!-- El script se autoinyectará aquí dinámicamente -->
    </div>
  </div>

  <script type="text/javascript">
    function cambiarPar(parCodigo) {
      // 1. Manejo visual de botones activos
      document.querySelectorAll('.btn-forex').forEach(btn => btn.classList.remove('active'));
      
      // Extraer el ID limpio quitando el prefijo "FX:"
      const idLimpio = parCodigo.replace('FX:', '');
      const botonSeleccionado = document.getElementById('btn-' + idLimpio);
      if (botonSeleccionado) {
        botonSeleccionado.classList.add('active');
      }

      // 2. Destruir y reconstruir el contenedor para limpiar la caché del widget previo
      const contenedorPadre = document.getElementById('contenedor-bloque-grafico');
      contenedorPadre.innerHTML = ''; 

      const subContenedor = document.createElement('div');
      subContenedor.className = 'tradingview-widget-container';
      subContenedor.style.width = '100%';
      subContenedor.style.height = '100%';

      const divWidget = document.createElement('div');
      divWidget.className = 'tradingview-widget-container__widget';
      divWidget.style.width = '100%';
      divWidget.style.height = '100%';

      subContenedor.appendChild(divWidget);
      contenedorPadre.appendChild(subContenedor);

      // 3. Crear e inyectar el script con la configuración del Widget Avanzado
      const scriptWidget = document.createElement('script');
      scriptWidget.type = 'text/javascript';
      scriptWidget.src = 'https://tradingview.com';
      scriptWidget.async = true;
      
      scriptWidget.text = JSON.stringify({
        "autosize": true,
        "symbol": parCodigo,
        "interval": "5",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "es",
        "allow_symbol_change": false,
        "calendar": false,
        "support_host": "https://tradingview.com"
      });

      subContenedor.appendChild(scriptWidget);
    }

    // Inicialización automática
    window.addEventListener('DOMContentLoaded', () => {
      cambiarPar('FX:EURUSD');
    });
  </script>

</body>
</html>
