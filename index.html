<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX-CORE | Terminal TradingView Realtime</title>
  
  <style>
    /* --- ESTILOS GENERALES INSTITUCIONALES --- */
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .terminal-container {
      width: 100%;
      max-width: 1200px;
      background-color: #131722;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .header-terminal {
      margin-bottom: 25px;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 15px;
    }

    .titulo-consola {
      font-size: 24px;
      font-weight: bold;
      color: #2962ff;
      letter-spacing: 1px;
      margin: 0;
    }

    /* --- PANEL GRID REORGANIZADO --- */
    .dashboard-forex {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .tarjeta-widget-nativa {
      height: 220px; /* Altura optimizada para mostrar precio y mini-gráfico lineal */
      background-color: #1c2030;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #2a2e39;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="header-terminal">
      <h1 class="titulo-consola">FX-CORE TERMINAL</h1>
    </div>

    <!-- Panel de Cotizaciones en Vivo de una Sola Línea de Código -->
    <div class="dashboard-forex">
      
      <!-- Componente Nativo Automatizado EUR/USD -->
      <div class="tarjeta-widget-nativa">
        <div class="tradingview-widget-container" style="width: 100%; height: 100%;">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://tradingview.com" async>
          {
            "symbol": "FX:EURUSD",
            "width": "100%",
            "height": "100%",
            "locale": "es",
            "dateRange": "1d",
            "colorTheme": "dark",
            "isWidescreen": true,
            "autosize": true,
            "trendLineColor": "#37a6ef",
            "underLineColor": "rgba(55, 166, 239, 0.15)"
          }
          </script>
        </div>
      </div>

      <!-- Componente Nativo Automatizado GBP/USD -->
      <div class="tarjeta-widget-nativa">
        <div class="tradingview-widget-container" style="width: 100%; height: 100%;">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://tradingview.com" async>
          {
            "symbol": "FX:GBPUSD",
            "width": "100%",
            "height": "100%",
            "locale": "es",
            "dateRange": "1d",
            "colorTheme": "dark",
            "isWidescreen": true,
            "autosize": true,
            "trendLineColor": "#00e676",
            "underLineColor": "rgba(0, 230, 118, 0.15)"
          }
          </script>
        </div>
      </div>

      <!-- Componente Nativo Automatizado USD/CHF -->
      <div class="tarjeta-widget-nativa">
        <div class="tradingview-widget-container" style="width: 100%; height: 100%;">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://tradingview.com" async>
          {
            "symbol": "FX:USDCHF",
            "width": "100%",
            "height": "100%",
            "locale": "es",
            "dateRange": "1d",
            "colorTheme": "dark",
            "isWidescreen": true,
            "autosize": true,
            "trendLineColor": "#ff5252",
            "underLineColor": "rgba(255, 82, 82, 0.15)"
          }
          </script>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
