<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX-CORE | Terminal TradingView Realtime</title>
    <style>
        /* --- ESTILOS GENERALES INSTITUCIONALES --- */
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #131a26;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        /* --- SELECTOR DE DIVISAS --- */
        .selector-box {
            display: flex;
            gap: 10px;
        }

        .pair-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .pair-btn:hover {
            border-color: #38bdf8;
            color: #ffffff;
        }

        .pair-btn.active {
            background: #38bdf8;
            color: #0b0f19;
            border-color: #38bdf8;
        }

        /* --- CONTENEDOR DE GRÁFICOS Y ANÁLISIS --- */
        .chart-wrapper {
            width: 100%;
            height: 450px;
            background: #1e222d;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .chart-container {
            display: none;
            width: 100%;
            height: 100%;
        }

        .chart-container.active {
            display: block;
        }

        /* --- PANEL DE SEÑALES INTELIGENTES (ALCISTA / BAJISTA) --- */
        .signals-panel {
            background: #1e222d;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #334155;
            text-align: center;
        }

        .panel-title {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Widget Técnico de TradingView integrado */
        .badge-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FX-CORE TERMINAL</h1>
            <!-- Selectores de divisas -->
            <div class="selector-box">
                <button id="btn-EURUSD" class="pair-btn active" onclick="cambiarPar('EURUSD')">EUR/USD</button>
                <button id="btn-GBPUSD" class="pair-btn" onclick="cambiarPar('GBPUSD')">GBP/USD</button>
                <button id="btn-USDCHF" class="pair-btn" onclick="cambiarPar('USDCHF')">USD/CHF</button>
            </div>
        </header>

        <!-- Área de Gráficos Avanzados en Vivo -->
        <div class="chart-wrapper">
            <!-- EURUSD CHART -->
            <div id="chart-EURUSD" class="chart-container active">
                <iframe src="https://tradingview.com" width="100%" height="100%" frameborder="0" allowfullscreen scrolling="no"></iframe>
            </div>
            <!-- GBPUSD CHART -->
            <div id="chart-GBPUSD" class="chart-container">
                <iframe src="https://tradingview.com" width="100%" height="100%" frameborder="0" allowfullscreen scrolling="no"></iframe>
            </div>
            <!-- USDCHF CHART -->
            <div id="chart-USDCHF" class="chart-container">
                <iframe src="https://tradingview.com" width="100%" height="100%" frameborder="0" allowfullscreen scrolling="no"></iframe>
            </div>
        </div>

        <!-- Panel de Estado Técnico e Indicador Alcista/Bajista -->
        <div class="signals-panel">
            <div class="panel-title">Estrategia Estructural y Sentimiento Institucional</div>
            <div class="badge-grid">
                <!-- Servidor seguro de TradingView que calcula la fuerza Alcista/Bajista de tus indicadores en vivo -->
                <iframe src="https://tradingview.com" width="100%" height="160" frameborder="0" allowfullscreen scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <script>
        function cambiarPar(par) {
            // Cambiar Pestañas Activas de los Botones
            document.querySelectorAll('.pair-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${par}`).classList.add('active');

            // Cambiar Visibilidad del Gráfico
            document.querySelectorAll('.chart-container').forEach(chart => chart.classList.remove('active'));
            document.getElementById(`chart-${par}`).classList.add('active');

            // Actualizar dinámicamente el Widget Técnico Inferior (Alcista/Bajista) sin recargar la página
            const badgeGrid = document.querySelector('.badge-grid');
            badgeGrid.innerHTML = `<iframe src="https://tradingview.com{par}&interval=5m&width=100%25&height=160&showIntervalTabs=false&isTransparent=true&theme=dark" width="100%" height="160" frameborder="0" allowfullscreen scrolling="no"></iframe>`;
        }
    </script>
</body>
</html>
